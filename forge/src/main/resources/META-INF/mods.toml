modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''
# The mixin configs come from the MixinConfigs attribute in the jar's manifest, which forge/build.gradle sets.
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
# Every field added here must also be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle.
