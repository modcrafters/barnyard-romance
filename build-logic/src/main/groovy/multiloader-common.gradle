plugins {
    id 'java-library'
    id 'maven-publish'
}

// Version projects sit at :<mc> for the common code and :<loader>:<mc> for fabric and neoforge.
def loaderName = project.parent == rootProject ? 'common' : project.parent.name
// The common project for this Minecraft version, e.g. :26.3 for :fabric:26.3.
def commonProject = loaderName == 'common' ? project : rootProject.project(":${project.name}")
// stonecutter.gradle.kts gives each branch its own Gradle group; published jars keep the mod's group.
def modGroup = rootProject.group

repositories {
    mavenCentral()
}

dependencies {
    // Null annotations: newer Minecraft ships JSpecify, 1.21.1 doesn't.
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

// Game tests are their own small mod, built from src/gametest beside the real one. The game test runs load both;
// the jars only ever hold main, so no test ships and main code can't call test code.
// The public API is its own source set too, src/api beside main: other mods compile against its jar, main and every
// test see it, and it can't see main. In a loader project it holds that loader's native events.
sourceSets {
    api
    main {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    test {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    gametest {
        compileClasspath += main.output + api.output
        runtimeClasspath += main.output + api.output
    }
}
configurations {
    // The API compiles against Minecraft; ApiSourcesTest keeps it off main's other libraries.
    apiCompileClasspath.extendsFrom compileClasspath
    apiRuntimeClasspath.extendsFrom runtimeClasspath
    gametestCompileClasspath.extendsFrom compileClasspath
    gametestRuntimeClasspath.extendsFrom runtimeClasspath
}

base {
    archivesName = "${mod_id}-${loaderName}-${minecraft_version}"
}

// A file under versions/<mc>/src replaces the shared file at the same path, for the common code and for this
// project's own branch. Stonecutter already drops the shared copy when it processes an inactive version, but the
// active version compiles the shared folders as they are, so the shared copy is left out here as well.
def versionOverrides = [rootProject.projectDir, project.parent.projectDir].unique().collectMany { branchDir ->
    ['main', 'gametest', 'api'].collectMany { sourceSet ->
        ['java', 'resources'].collect { kind ->
            [shared: new File(branchDir, "src/${sourceSet}/${kind}").toPath(), local: new File(branchDir, "versions/${project.name}/src/${sourceSet}/${kind}")]
        }
    }
}
def overridden = { FileTreeElement element ->
    !element.directory && versionOverrides.any { dirs ->
        element.file.toPath().startsWith(dirs.shared) && new File(dirs.local, element.relativePath.pathString).exists()
    }
}
tasks.withType(SourceTask).configureEach { exclude(overridden) }
tasks.withType(AbstractCopyTask).configureEach { exclude(overridden) }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// The game test mod's resources (src/gametest) are expanded the same way.
tasks.withType(ProcessResources).configureEach {
    var expandProps = [
            'version'                      : version,
            'group'                        : modGroup, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            // Only one loader's nodes define each loader's versions.
            'fabric_version'               : findProperty('fabric_version') ?: '',
            'fabric_loader_version'        : findProperty('fabric_loader_version') ?: '',
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : findProperty('neoforge_version') ?: '',
            'neoforge_loader_version_range': findProperty('neoforge_loader_version_range') ?: '',
            'credits'                      : credits,
            'java_version'                 : java_version,
            // Mixins only some versions have, as quoted names with a trailing comma, from versions/<mc>/gradle.properties.
            'extra_mixins'                 : commonProject.findProperty('extra_mixins') ?: '',
            // The same for client-only mixins.
            'extra_client_mixins'          : commonProject.findProperty('extra_client_mixins') ?: ''
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId modGroup
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

// The public API's own jars, which other mods compile against. The common project's holds the API for its Minecraft
// version; a loader's holds only that loader's native events, as its api output also carries the common API compiled
// with them. The loader's published metadata depends on the common one, so a modder adds one dependency.
def apiArchiveName = loaderName == 'common' ? "${mod_id}-api-${minecraft_version}" : "${mod_id}-api-${loaderName}-${minecraft_version}"
def apiClasses = loaderName == 'common' ? 'net/modcrafters/minecraft/barnyardromance/api/**' : "net/modcrafters/minecraft/barnyardromance/api/${loaderName}/**"
def generateApi = tasks.matching { it.name == 'stonecutterGenerateApi' }
def apiJar = tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'The public API jar other mods compile against.'
    archiveBaseName = apiArchiveName
    from(sourceSets.api.output) {
        include apiClasses
    }
}
def apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    dependsOn(generateApi)
    archiveBaseName = apiArchiveName
    archiveClassifier = 'sources'
    from(sourceSets.api.allSource)
}
def apiJavadoc = tasks.register('apiJavadoc', Javadoc) {
    dependsOn(generateApi)
    source = sourceSets.api.allJava
    classpath = sourceSets.api.compileClasspath + sourceSets.api.output
    destinationDir = layout.buildDirectory.dir('docs/apiJavadoc').get().asFile
    options.addStringOption('Xdoclint:none', '-quiet')
}
def apiJavadocJar = tasks.register('apiJavadocJar', Jar) {
    archiveBaseName = apiArchiveName
    archiveClassifier = 'javadoc'
    from(apiJavadoc)
}

publishing {
    publications {
        register('api', MavenPublication) {
            groupId = rootProject.group
            artifactId = apiArchiveName
            version = project.version
            artifact apiJar
            artifact apiSourcesJar
            artifact apiJavadocJar
            if (loaderName != 'common') {
                def commonApi = "${mod_id}-api-${minecraft_version}"
                pom.withXml {
                    def dependency = asNode().appendNode('dependencies').appendNode('dependency')
                    dependency.appendNode('groupId', rootProject.group)
                    dependency.appendNode('artifactId', commonApi)
                    dependency.appendNode('version', project.version)
                    dependency.appendNode('scope', 'compile')
                }
            }
        }
    }
    // The release maven: set MAVEN_URL, MAVEN_USERNAME and MAVEN_PASSWORD to publish the API jars there with
    // publishApiPublicationToReleaseRepository. Without MAVEN_URL there is no such repository.
    repositories {
        if (System.getenv('MAVEN_URL')) {
            maven {
                name = 'release'
                url = System.getenv('MAVEN_URL')
                if (System.getenv('MAVEN_USERNAME')) {
                    credentials {
                        username = System.getenv('MAVEN_USERNAME')
                        password = System.getenv('MAVEN_PASSWORD')
                    }
                }
            }
        }
    }
}
