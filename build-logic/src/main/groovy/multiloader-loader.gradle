plugins {
    id 'multiloader-common'
}

configurations {
    // Only resolved here; the common project for the same Minecraft version provides them.
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    commonApiJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonGametestJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonGametestResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The common project for this loader's Minecraft version, e.g. :26.3 for :fabric:26.3.
def commonPath = ":${stonecutter.current.project}"

dependencies {
    compileOnly(project(commonPath)) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: commonPath, configuration: 'commonJava'))
    commonResources(project(path: commonPath, configuration: 'commonResources'))
    commonApiJava(project(path: commonPath, configuration: 'commonApiJava'))
    commonGametestJava(project(path: commonPath, configuration: 'commonGametestJava'))
    commonGametestResources(project(path: commonPath, configuration: 'commonGametestResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

// The loader's api source set holds the common public API and this loader's native events (src/api here), so main
// sees both through api.output. The mod jar carries them too, so players install one file.
tasks.named('compileApiJava', JavaCompile) {
    dependsOn(configurations.commonApiJava)
    source(configurations.commonApiJava)
}

tasks.named('jar', Jar) {
    from(sourceSets.api.output)
}

// The loader's API jar holds the whole API, so its sources and javadoc take in the common API too.
tasks.named('apiSourcesJar', Jar) {
    dependsOn(configurations.commonApiJava)
    from(configurations.commonApiJava)
}

tasks.named('apiJavadoc', Javadoc) {
    dependsOn(configurations.commonApiJava)
    source(configurations.commonApiJava)
}

// The mod itself on the release maven, as <loader>-<mc> beside its <loader>-<mc>-api, so another mod can compile
// against the API and still run the real mod in its dev runs. The released jar runs there as it is: 26.3 isn't
// obfuscated, and NeoForge 1.21.1 runs Mojang's names. Only the jar and its sources go up, with no dependencies in
// the metadata, so this build's own dependencies never reach another mod's build.
publishing {
    publications {
        register('mod', MavenPublication) {
            groupId = rootProject.group
            artifactId = "${project.parent.name}-${minecraft_version}"
            version = project.version
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
        }
    }
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// The loader's game test mod: the shared tests plus the loader's own wrappers in <loader>/src/gametest.
tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

tasks.named('processGametestResources', ProcessResources) {
    dependsOn(configurations.commonGametestResources)
    from(configurations.commonGametestResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava, configurations.commonApiJava)
    source(configurations.commonJava, configurations.commonApiJava)
}

// The mod's sources: the common code and API, and this loader's own main and API (its native events).
tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava, configurations.commonApiJava)
    dependsOn(tasks.matching { it.name == 'stonecutterGenerateApi' })
    from(configurations.commonJava)
    from(configurations.commonApiJava)
    from(sourceSets.api.allSource)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
