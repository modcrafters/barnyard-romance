plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/naturalist-runs.gradle')
apply from: rootProject.file('gradle/jade-runs.gradle')

dependencies {
    // The common sources are compiled again here, compat/jade with them. Optional: nothing ships with Jade or needs it.
    compileOnly "maven.modrinth:jade:${jade_loader_version}"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            programArguments.addAll '--width', '2560', '--height', '1440'
            systemProperty('barnyard_romance.herd_sticks', 'true')
        }
        data {
            // clientData() since 1.21.4, data() before (neoforge_data_run in each version's gradle.properties).
            "${neoforge_data_run}"()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
        // Compatibility testing with Naturalist, see gradle/naturalist-runs.gradle.
        clientNaturalist {
            client()
            gameDirectory = this.mkdir(this.file('runs/naturalist-client'))
            programArguments.addAll '--width', '2560', '--height', '1440'
            systemProperty('barnyard_romance.herd_sticks', 'true')
        }
        gameTestServerNaturalist {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/naturalist-gametest'))
            systemProperty('barnyard_romance.expect_naturalist', 'true')
        }
        // Our stats in Jade's tooltip, see gradle/jade-runs.gradle.
        clientJade {
            client()
            gameDirectory = this.mkdir(this.file('runs/jade-client'))
            programArguments.addAll '--width', '2560', '--height', '1440'
            systemProperty('barnyard_romance.herd_sticks', 'true')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// taskBefore also covers the IntelliJ run configs, which don't start the Gradle run task.
neoForge.runs.clientNaturalist.taskBefore(naturalistInRun('clientNaturalist', 'runs/naturalist-client'))
neoForge.runs.gameTestServerNaturalist.taskBefore(naturalistInRun('gameTestServerNaturalist', 'runs/naturalist-gametest'))
neoForge.runs.clientJade.taskBefore(jadeInRun('clientJade', 'runs/jade-client'))

// Game tests start from a fresh world, as on CI. A saved world keeps its clock, so a later run could cross
// midnight partway through and hunger or Vigour refills would hit unrelated tests. 1.21.1 saves the world
// in world, 26.3 in gametestserver.
['gameTestServer': 'runs/gametest', 'gameTestServerNaturalist': 'runs/naturalist-gametest'].each { runName, runDir ->
    def clean = tasks.register("clean${runName.capitalize()}World", Delete) {
        description = "Deletes the ${runDir} world so the run starts fresh."
        delete file("${runDir}/world"), file("${runDir}/gametestserver")
    }
    neoForge.runs.named(runName) { it.taskBefore(clean) }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
