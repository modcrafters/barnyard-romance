# Every field added here must also be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle.
# Minecraft, Java and loader versions differ per version, so they live in each
# version's gradle.properties: versions/<mc>, fabric/versions/<mc> and neoforge/versions/<mc>.
# Values shared by every version of one loader live in fabric/ and neoforge/gradle.properties.

# Project
version=0.1.0
group=net.modcrafters.minecraft

# Common
mod_name=Barnyard Romance
mod_author=Barnyard Romance
mod_id=barnyard_romance
license=MIT
credits=
description=Sexes, size, and breeding rules for Minecraft animals.

# Gradle
# The build scripts stay in Groovy (build-logic and the loader scripts); this silences Stonecutter's Kotlin nudge.
dev.kikugie.stonecutter.hard_mode=true
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
