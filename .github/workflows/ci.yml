name: CI

# Every pull request must build and pass on every Minecraft version before it can merge.
# `all-versions` only passes when every version job did, so it is the one check for a ruleset on main to require.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  mc-26-3:
    name: Minecraft 26.3 (Fabric + NeoForge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6

      # Git must hold the sources in their 26.3 state; Stonecutter rewrites them when another version is active.
      - name: Check the sources are committed with 26.3 active
        run: |
          ./gradlew "Reset active project"
          git diff --exit-code

      - name: Unit tests, jars and server game tests
        run: ./gradlew :26.3:test :fabric:26.3:build :neoforge:26.3:build :neoforge:26.3:runGameTestServer :fabric:26.3:runGametest

      # A virtual 24-bit screen with Mesa's software OpenGL; the default 8-bit xvfb screen has no usable GL visual.
      - name: Fabric client game test
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:26.3:runClientGametest

      - name: Upload the client game test's logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-26.3
          path: |
            fabric/versions/26.3/runs/clientGametest/logs/
            fabric/versions/26.3/runs/clientGametest/screenshots/
          if-no-files-found: ignore

      - name: Collect jars
        run: ./gradlew collectJars

      - uses: actions/upload-artifact@v7
        with:
          name: jars-26.3
          path: build/libs/*/*.jar

  all-versions:
    name: all-versions
    if: always()
    needs: [mc-26-3]
    runs-on: ubuntu-latest
    steps:
      - name: Every version passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
