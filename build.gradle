plugins {
    id 'multiloader-common'
}

// 1.20.1 has no NeoForm, so its common project uses ModDevGradle's legacy plugin in vanilla mode (plain Minecraft
// through MCP names). Both plugins come from the same artifact version, applied in stonecutter.gradle.kts.
def legacy = stonecutter.eval(stonecutter.current.version, "<1.20.5")
apply plugin: legacy ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'

if (legacy) {
    legacyForge {
        mcpVersion = minecraft_version
    }
} else {
    neoForge {
        neoFormVersion = neo_form_version
        // Automatically enable AccessTransformers if the file exists
        def at = rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
        if (at.exists()) {
            accessTransformers.from(at.absolutePath)
        }
    }
}

repositories {
    mavenCentral()
}
apply from: rootProject.file('gradle/modrinth-maven.gradle')

dependencies {
    // Jade's API, for compat/jade only. Optional: nothing ships with Jade or needs it.
    // Forge 1.20.1's Jade is published with SRG names, so the legacy plugin remaps it.
    add(legacy ? 'modCompileOnly' : 'compileOnly', "maven.modrinth:jade:${jade_version}")
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // ApiJarTest reads the API jar other mods would get.
    def apiJar = tasks.named('apiJar', Jar)
    dependsOn(apiJar)
    // ...and each loader's, for this Minecraft version: its API jar and its mod sources jar.
    // Forge is left out until its loader code and native events are written (Task 4 of the 1.20.1 plan adds it back);
    // ApiJarTest is told, so a version with no other loader skips its loader checks rather than passing them.
    def pending = ['forge'].findAll { rootProject.findProject(":${it}:${stonecutter.current.project}") != null }
    def loaders = ['fabric', 'neoforge'].findAll { rootProject.findProject(":${it}:${stonecutter.current.project}") != null }
    loaders.each { loader ->
        dependsOn(":${loader}:${stonecutter.current.project}:apiJar", ":${loader}:${stonecutter.current.project}:sourcesJar")
    }
    doFirst {
        systemProperty 'barnyard_romance.api_jar', apiJar.get().archiveFile.get().asFile.absolutePath
        systemProperty 'barnyard_romance.loaders_pending', pending.join(';')
        systemProperty 'barnyard_romance.loader_jars', loaders.collect { loader ->
            def tasks = rootProject.project(":${loader}:${stonecutter.current.project}").tasks
            [loader, tasks.named('apiJar', Jar).get(), tasks.named('sourcesJar', Jar).get()]
                    .collect { it instanceof Jar ? it.archiveFile.get().asFile.absolutePath : it }.join('|')
        }.join(';')
    }
}

// The save fixture tests (saves/SaveFixturesTest) read and write NBT with the real codecs, so unit tests see
// Minecraft the way main does. Minecraft brings Gson and SLF4J with it, at the versions it was built with; SLF4J
// logs through Minecraft's Log4j, which src/test/resources/log4j2-test.xml keeps quiet.
configurations {
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    // The public API's sources, which each loader compiles into its mod jar.
    commonApiJava {
        canBeResolved = false
        canBeConsumed = true
    }
    // The shared game tests, for each loader's game test mod.
    commonGametestJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonGametestResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Loaders compile the common sources for their own Minecraft version: Stonecutter's processed copy of src/,
// plus files that versions/<mc>/src overrides or adds.
artifacts {
    sourceSets.main.java.srcDirs.each { dir ->
        add('commonJava', dir) { builtBy 'stonecutterGenerate' }
    }
    sourceSets.main.resources.srcDirs.each { dir ->
        add('commonResources', dir) { builtBy 'stonecutterGenerate' }
    }
    sourceSets.api.java.srcDirs.each { dir ->
        add('commonApiJava', dir) { builtBy 'stonecutterGenerateApi' }
    }
    sourceSets.gametest.java.srcDirs.each { dir ->
        add('commonGametestJava', dir) { builtBy 'stonecutterGenerateGametest' }
    }
    sourceSets.gametest.resources.srcDirs.each { dir ->
        add('commonGametestResources', dir) { builtBy 'stonecutterGenerateGametest' }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
