plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/naturalist-runs.gradle')
apply from: rootProject.file('gradle/jade-runs.gradle')

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // The common sources are compiled again here, compat/jade with them. Optional: nothing ships with Jade or needs it.
    compileOnly("maven.modrinth:jade:${jade_loader_version}")
}

loom {
    def aw = rootProject.file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml")
            runDir('runs/gametest')
        }
        clientGametest {
            client()
            setConfigName('Fabric Client Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric.client.gametest')
            runDir('runs/clientGametest')
        }
        // Compatibility testing with Naturalist, see gradle/naturalist-runs.gradle.
        clientNaturalist {
            client()
            setConfigName('Fabric Client (Naturalist)')
            runDir('runs/naturalist-client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
        gametestNaturalist {
            server()
            setConfigName('Fabric Game Test (Naturalist)')
            vmArg('-Dfabric-api.gametest')
            vmArg('-Dbarnyard_romance.expect_naturalist=true')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-naturalist/junit.xml")
            runDir('runs/naturalist-gametest')
        }
        // Our stats in Jade's tooltip, see gradle/jade-runs.gradle.
        clientJade {
            client()
            setConfigName('Fabric Client (Jade)')
            runDir('runs/jade-client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
    }
}

naturalistInRun('clientNaturalist', 'runs/naturalist-client')
naturalistInRun('gametestNaturalist', 'runs/naturalist-gametest')
jadeInRun('clientJade', 'runs/jade-client')

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
