plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/naturalist-runs.gradle')
apply from: rootProject.file('gradle/farm-mods-runs.gradle')
apply from: rootProject.file('gradle/jade-runs.gradle')
apply from: rootProject.file('gradle/fresh-animations-runs.gradle')

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // The common sources are compiled again here, compat/jade with them. Optional: nothing ships with Jade or needs it.
    compileOnly("maven.modrinth:jade:${jade_loader_version}")
}

loom {
    def aw = rootProject.file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // The game test mod (src/gametest) has its own classpath group; only the game test runs load it.
    mods {
        // The public API and its Fabric events load as part of the mod.
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            source sourceSets.gametest
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml")
            runDir('runs/gametest')
        }
        clientGametest {
            client()
            setConfigName('Fabric Client Game Test')
            ideConfigGenerated(true)
            source sourceSets.gametest
            vmArg('-Dfabric.client.gametest')
            runDir('runs/clientGametest')
        }
        // Compatibility testing with Naturalist, see gradle/naturalist-runs.gradle.
        clientNaturalist {
            client()
            setConfigName('Fabric Client (Naturalist)')
            runDir('runs/naturalist-client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
        gametestNaturalist {
            server()
            setConfigName('Fabric Game Test (Naturalist)')
            source sourceSets.gametest
            vmArg('-Dfabric-api.gametest')
            vmArg('-Dbarnyard_romance.expect_naturalist=true')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-naturalist/junit.xml")
            runDir('runs/naturalist-gametest')
        }
        // Compatibility testing with the farm-animal mods, see gradle/farm-mods-runs.gradle.
        clientFarmMods {
            client()
            setConfigName('Fabric Client (Farm Mods)')
            runDir('runs/farm-mods-client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
        gametestFarmMods {
            server()
            setConfigName('Fabric Game Test (Farm Mods)')
            source sourceSets.gametest
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dbarnyard_romance.expect_mods=${farmModIds}")
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-farm-mods/junit.xml")
            runDir('runs/farm-mods-gametest')
        }
        // Our stats in Jade's tooltip, see gradle/jade-runs.gradle.
        clientJade {
            client()
            setConfigName('Fabric Client (Jade)')
            runDir('runs/jade-client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
        // Our horns on Fresh Animations' models, see gradle/fresh-animations-runs.gradle.
        clientFreshAnimations {
            client()
            setConfigName('Fabric Client (Fresh Animations)')
            runDir('runs/fresh-animations-client')
            programArgs('--width', '2560', '--height', '1440')
            vmArg('-Dbarnyard_romance.herd_sticks=true')
        }
    }
}

naturalistInRun('clientNaturalist', 'runs/naturalist-client')
naturalistInRun('gametestNaturalist', 'runs/naturalist-gametest')
farmModsInRun('clientFarmMods', 'runs/farm-mods-client')
farmModsInRun('gametestFarmMods', 'runs/farm-mods-gametest')
jadeInRun('clientJade', 'runs/jade-client')
freshAnimationsInRun('clientFreshAnimations', 'runs/fresh-animations-client')

// Game tests start from a fresh world, as on CI. A saved world keeps its clock, so a later run could cross
// midnight partway through and hunger or Vigour refills would hit unrelated tests.
['gametest': 'runs/gametest', 'gametestNaturalist': 'runs/naturalist-gametest',
 'gametestFarmMods': 'runs/farm-mods-gametest'].each { runName, runDir ->
    def clean = tasks.register("clean${runName.capitalize()}World", Delete) {
        description = "Deletes the ${runDir} world so the run starts fresh."
        delete file("${runDir}/world")
    }
    tasks.matching { it.name == "run${runName.capitalize()}" }.configureEach {
        dependsOn clean
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
