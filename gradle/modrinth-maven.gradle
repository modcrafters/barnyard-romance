// The Modrinth maven, for group maven.modrinth only. Several scripts need it in one project, and a second exclusive
// declaration for the same group makes Gradle find the group in neither, so it's added once.
if (repositories.findByName('Modrinth') == null) {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
    }
}

// The configuration a run's mod jars are added to, for a run script's own configuration of them. Forge 1.20.1's mods
// are published with SRG names, and the dev game runs on Mojang's: there the jars go through a remapping configuration
// (ModDevGradle's legacyforge), which hands runJars the remapped jars. Elsewhere they go straight into runJars.
ext.runModsSource = { Configuration runJars ->
    extensions.findByName('obfuscation') != null ? obfuscation.createRemappingConfiguration(runJars).name : runJars.name
}
