// Naturalist, for compatibility testing only. The mod never compiles or ships against it: Gradle
// resolves the jar when one of these runs starts and copies it to that run's own mods folder, so
// the normal runs, the tests and the published jars don't see it.
// Forge 1.20.1 takes 2.0.9: its 2.0.7 runs in the dev game but crashes a real one at start (its mixins have no refmap),
// and 2.0.8 still disconnects players joining a server.
def naturalistVersion = project.parent.name == 'forge' ? '2.0.9' : '2.0.7'

apply from: rootProject.file('gradle/modrinth-maven.gradle')

configurations {
    naturalistMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    // Remapped first on Forge 1.20.1 (see gradle/modrinth-maven.gradle).
    add(runModsSource(configurations.naturalistMod), "maven.modrinth:naturalist:${naturalistVersion}+${minecraft_version}-${project.parent.name}")
}

// Call for each Naturalist run. The mods folder is synced, so it holds exactly this jar.
ext.naturalistInRun = { String runName, String gameDirectory ->
    def sync = tasks.register("sync${runName.capitalize()}Mods", Sync) {
        group = 'naturalist'
        description = "Copies the Naturalist jar to ${gameDirectory}/mods."
        from configurations.naturalistMod
        into file("${gameDirectory}/mods")
    }
    tasks.matching { it.name == "run${runName.capitalize()}" }.configureEach {
        group = 'naturalist'
        dependsOn sync
    }
    return sync
}
